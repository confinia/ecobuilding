# EcoBuilding BDNB self-hosting (project: ecobuilding-bdnb, issue #28).
# Full-France BDNB restored into PostGIS + PostgREST on top, so the API keeps
# the exact api.bdnb.io query syntax (?col=eq.val) with only a base-URL swap.
# Stateful + heavy, so OUTSIDE blue/green (like auth & monitoring). PostgREST
# published on 0.0.0.0 (ufw-blocked) so app containers reach it via the host
# gateway, same pattern as Keycloak.
services:
  bdnb-db:
    image: docker.io/postgis/postgis:16-3.4
    shm_size: 2g
    environment:
      POSTGRES_DB: bdnb
      POSTGRES_USER: bdnb
    env_file:
      - ../deploy/secrets.env   # POSTGRES_PASSWORD (= BDNB_DB_PASSWORD)
    # This DB is a rebuildable mirror of the public BDNB dump (never a source of
    # truth), so durability is disposable: fsync/synchronous_commit off gives a
    # large speedup on the one-time 168 GB bulk load and on index builds, and a
    # crash just means re-running deploy/bdnb-import.sh.
    command: ["postgres", "-c", "max_connections=100", "-c", "shared_buffers=2GB",
              "-c", "work_mem=64MB", "-c", "maintenance_work_mem=2GB",
              "-c", "fsync=off", "-c", "synchronous_commit=off",
              "-c", "full_page_writes=off", "-c", "autovacuum=off"]
    volumes:
      - bdnb_pgdata:/var/lib/postgresql/data
    # Loopback port so Grafana — which runs on the HOST network — can query the
    # view log directly (#349). 13030 = product 3, shared tier, service 3 (db)
    # in the platform numbering. Never exposed beyond 127.0.0.1.
    ports:
      - "127.0.0.1:13030:5432"
    mem_limit: 2g
    cpus: 2.0
    # Rule 25 (#437): health readable by podman, hence by the podman exporter
    # the shared prometheus already scrapes.
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "bdnb"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # PostgREST mirrors the BDNB REST interface. db-schema is set after restore
  # (see deploy/bdnb-import.sh, which discovers the schema and writes it here
  # via the PGRST_DB_SCHEMAS env in secrets.env).
  bdnb-rest:
    image: docker.io/postgrest/postgrest:v12.2.3
    # Connects as the authenticator (bdnb) from secrets.env's PGRST_DB_URI, then
    # switches to bdnb_anon for every request (NOLOGIN, EXECUTE only on the
    # exposed RPCs). Exposes schema "dvf": the prices_for_building RPC (#89).
    env_file:
      - ../deploy/secrets.env    # PGRST_DB_URI=postgres://bdnb:<pwd>@bdnb-db:5432/bdnb
    environment:
      PGRST_DB_ANON_ROLE: bdnb_anon
      # "vues" carries the building-view log the Grafana map reads (#349):
      # its own schema rather than a telemetry table dropped into dvf, so what
      # is data and what is usage stay visibly separate.
      PGRST_DB_SCHEMAS: dvf,vues
      PGRST_DB_POOL: "20"
      PGRST_SERVER_PORT: "3005"
      # Admin server (#437): /live, /ready and Prometheus /metrics. The image
      # is distroless (no shell), so health goes through this port and the
      # monitoring stack, not through a compose healthcheck.
      PGRST_ADMIN_SERVER_PORT: "3015"
    ports:
      - "127.0.0.1:13020:3005"   # 1PESI (#173); consumers use alias bdnb-rest
      - "127.0.0.1:13022:3015"   # admin: scraped by the shared prometheus
    depends_on:
      - bdnb-db
    networks:
      default:
      internal:
        aliases: [bdnb-rest]
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped

  # Second PostgREST, serving ONLY schema "bdnb": the api.bdnb.io-compatible
  # views built by deploy/bdnb-local-api.sh (#28). A separate instance rather
  # than adding the schema to bdnb-rest because PostgREST's default schema is
  # the first of PGRST_DB_SCHEMAS — the API would then need an Accept-Profile
  # header on every call, i.e. a code change; here the cutover stays pure
  # configuration (BDNB_*_URL). The 2026-09-10/11 api.bdnb.io outage turned
  # every address lookup into a 500 while this very data sat in bdnb-db.
  bdnb-open:
    image: docker.io/postgrest/postgrest:v12.2.3
    env_file:
      - ../deploy/secrets.env    # PGRST_DB_URI (PGRST_DB_SCHEMAS overridden here)
    environment:
      PGRST_DB_ANON_ROLE: bdnb_anon
      PGRST_DB_SCHEMAS: bdnb
      PGRST_DB_POOL: "10"
      PGRST_SERVER_PORT: "3006"
      # Admin server (#437): /live, /ready, /metrics — see bdnb-rest.
      PGRST_ADMIN_SERVER_PORT: "3016"
    ports:
      # 1PESI (#173): second instance of the PostgREST service (13020 being
      # bdnb-rest). NOT 13040: the monitoring edge already listens there.
      - "127.0.0.1:13021:3006"   # consumers use alias bdnb-open
      - "127.0.0.1:13023:3016"   # admin: scraped by the shared prometheus
    mem_limit: 256m
    cpus: 0.5
    depends_on:
      - bdnb-db
    networks:
      default:
      internal:
        aliases: [bdnb-open]
    restart: unless-stopped

  # Postgres metrics for bdnb-db (#437, rule 25): size, connections, activity.
  # Lives IN this stack (rule 24) and publishes on loopback for the shared
  # prometheus, like every 13xxx service. DATA_SOURCE_PASS is appended to
  # deploy/secrets.env by deploy/bdnb-local-api.sh (never committed).
  bdnb-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.16.0
    env_file:
      - ../deploy/secrets.env    # DATA_SOURCE_PASS (= BDNB_DB_PASSWORD)
    environment:
      DATA_SOURCE_URI: bdnb-db:5432/bdnb?sslmode=disable
      DATA_SOURCE_USER: bdnb
    ports:
      - "127.0.0.1:13031:9187"
    mem_limit: 128m
    cpus: 0.25
    depends_on:
      - bdnb-db
    restart: unless-stopped

networks:
  default: {}
  internal:
    name: ecobuilding-internal
    external: true

volumes:
  bdnb_pgdata:
