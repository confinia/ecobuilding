# EcoBuilding BDNB self-hosting (project: ecobuilding-bdnb, issue #28).
# Full-France BDNB restored into PostGIS + PostgREST on top, so the API keeps
# the exact api.bdnb.io query syntax (?col=eq.val) with only a base-URL swap.
# Stateful + heavy, so OUTSIDE blue/green (like auth & monitoring). PostgREST
# published on 0.0.0.0 (ufw-blocked) so app containers reach it via the host
# gateway, same pattern as Keycloak.
services:
  bdnb-db:
    image: docker.io/postgis/postgis:16-3.4
    shm_size: 2g
    environment:
      POSTGRES_DB: bdnb
      POSTGRES_USER: bdnb
    env_file:
      - ../deploy/secrets.env   # POSTGRES_PASSWORD (= BDNB_DB_PASSWORD)
    command: ["postgres", "-c", "max_connections=100", "-c", "shared_buffers=2GB",
              "-c", "work_mem=64MB", "-c", "maintenance_work_mem=1GB"]
    volumes:
      - bdnb_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  # PostgREST mirrors the BDNB REST interface. db-schema is set after restore
  # (see deploy/bdnb-import.sh, which discovers the schema and writes it here
  # via the PGRST_DB_SCHEMAS env in secrets.env).
  bdnb-rest:
    image: docker.io/postgrest/postgrest:v12.2.3
    environment:
      PGRST_DB_URI: postgres://bdnb_anon@bdnb-db:5432/bdnb
      PGRST_DB_ANON_ROLE: bdnb_anon
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS:-public}
      PGRST_DB_POOL: "20"
      PGRST_SERVER_PORT: "3005"
    ports:
      - "3005:3005"
    depends_on:
      - bdnb-db
    restart: unless-stopped

volumes:
  bdnb_pgdata:
