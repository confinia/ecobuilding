# EcoBuilding — ONE complete, self-contained stack (app + its own edge caddy
# + full monitoring). Instantiated TWICE for blue/green:
#
#   podman-compose -p ecobuilding-blue  -f docker-compose.yml -f deploy/blue.override.yml  up -d
#   podman-compose -p ecobuilding-green -f docker-compose.yml -f deploy/green.override.yml up -d
#
# The ONLY published port is this stack's caddy (blue 127.0.0.1:8021, green
# 127.0.0.1:8022 — set by the override files); everything else stays on the
# stack's private network, so the two stacks can never collide. The router
# (caddy_server/) maps prod/next hostnames to the stacks; the VM's main caddy
# terminates TLS and forwards to the router.

services:
  # Stack entry: routes /api, /grafana and / to this stack's own services.
  caddy:
    image: docker.io/library/caddy:2
    volumes:
      - ./stack_caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    # ports: set per stack by deploy/{blue,green}.override.yml
    restart: unless-stopped

  api:
    build: ./api
    image: ecobuilding-api:latest
    env_file:
      - ./deploy/secrets.env   # KC_BOOTSTRAP_ADMIN_* for the identity gauges
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: ecobuilding-api
      GEOIP_DB: /geoip/dbip-country-lite.mmdb
      # 3D DPE building map in the PDF report via the headless render service
      # (#88), reached over the host gateway like Keycloak/bdnb. Must be the
      # full /shot endpoint (the API GETs it directly with lon/lat/... params).
      RENDER_URL: http://host.containers.internal:8040/shot
      # Reach Keycloak internally over the shared network (see auth_stack).
      KC_ADMIN_BASE: http://host.containers.internal:8181/auth
      OIDC_JWKS_URL: http://host.containers.internal:8181/auth/realms/confinia/protocol/openid-connect/certs
      OIDC_ISSUER: https://ecobuilding.confinia.io/auth/realms/confinia
    volumes:
      # Country-level GeoIP (dbip-country-lite) — provisioned by deploy.sh,
      # outside git and outside the rsync --delete scope.
      - ./data/geoip:/geoip:ro
      # Lead capture (offer page) — persisted outside git/rsync, shared by
      # both stacks so no lead is lost across promotes.
      - ./data/leads:/leads
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: ecobuilding-frontend:latest
    restart: unless-stopped

  # App-local OTel buffer; its prometheus exporter (:8889) is published per
  # stack (blue 127.0.0.1:8891 / green :8892 via the override files) and
  # scraped by the SHARED monitoring project (monitoring_stack/), which owns
  # prometheus + grafana + podman-exporter — metrics survive promotes.
  otel-collector:
    image: docker.io/otel/opentelemetry-collector-contrib:0.119.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./monitoring/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    # ports: set per stack by deploy/{blue,green}.override.yml
    restart: unless-stopped
