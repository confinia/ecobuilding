# EcoBuilding — ONE complete, self-contained stack (app + its own edge caddy
# + full monitoring). Instantiated TWICE for blue/green:
#
#   podman-compose -p ecobuilding-blue  -f docker-compose.yml -f deploy/blue.override.yml  up -d
#   podman-compose -p ecobuilding-green -f docker-compose.yml -f deploy/green.override.yml up -d
#
# The ONLY published port is this stack's caddy (blue 127.0.0.1:13100, green
# 127.0.0.1:13200 — set by the override files); everything else stays on the
# stack's private network, so the two stacks can never collide. The router
# (caddy_server/) maps prod/next hostnames to the stacks; the VM's main caddy
# terminates TLS and forwards to the router.

services:
  # Stack entry: routes /api, /grafana and / to this stack's own services.
  caddy:
    image: docker.io/library/caddy:2
    volumes:
      - ./stack_caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    # ports: set per stack by deploy/{blue,green}.override.yml
    restart: unless-stopped

  api:
    build: ./api
    image: ecobuilding-api:latest
    env_file:
      - ./deploy/secrets.env   # KC_BOOTSTRAP_ADMIN_* for the identity gauges
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: ecobuilding-api
      GEOIP_DB: /geoip/dbip-country-lite.mmdb
      # 3D DPE building map in the PDF report via the headless render service
      # (#88), reached over the host gateway like Keycloak/bdnb. Must be the
      # full /shot endpoint (the API GETs it directly with lon/lat/... params).
      # Shared services via the ecobuilding-internal network (#173): loopback
      # 13xxx publishes are unreachable from bridged containers, so east-west
      # traffic uses DNS aliases (keycloak / render / bdnb-rest).
      # PHASE « OFFERT » (décidée le 2026-08-21) — voir IPHONE.md §3.
      # L'app mobile est publiée gratuitement et sans mur, le temps de mesurer
      # les usages réels : les paliers 30/150 fiches sont aujourd'hui des
      # hypothèses, pas des mesures. Ce plafond n'est PAS un quota produit,
      # c'est un garde-fou : très au-dessus de tout usage humain, il empêche
      # qu'un script épuise le rendu PDF et le quota BDNB (10 000 requêtes par
      # mois pour toute la plateforme) au détriment de tous.
      # À REMPLACER par le quota produit le jour où le mur payant existe.
      MOBILE_FREE_REPORTS: "300"
      # Bêta-testeurs identifiés, exemptés même de ce garde-fou.
      MOBILE_BETA_IDS: "${MOBILE_BETA_IDS:-}"
      RENDER_URL: http://render:8040/shot
      DVF_RPC_URL: http://bdnb-rest:3005/rpc/prices_for_building
      # Reach Keycloak internally over the shared network (see auth_stack).
      KC_ADMIN_BASE: http://keycloak:8080/auth
      OIDC_JWKS_URL: http://keycloak:8080/auth/realms/confinia/protocol/openid-connect/certs
      OIDC_ISSUER: https://ecobuilding.confinia.io/auth/realms/confinia
      # Histoire des communes (#275) : vient de deploy/secrets.env. Vide, le
      # bloc commune ne s'affiche pas — la fiche ne dépend jamais d'un tiers.
      CONFINIA_API_KEY: "${CONFINIA_API_KEY:-}"
    # `api.confinia.io` pointe sur l'ADRESSE PUBLIQUE DE CETTE MACHINE : Confinia
    # tourne sur la même VM. Un conteneur sans privilèges ne sait pas revenir
    # sur l'IP publique de son propre hôte (pas de retour en épingle), et
    # l'appel échouait en « connection refused » — le bloc commune disparaissait
    # alors silencieusement, ce qui est son comportement voulu en cas de panne
    # et masquait donc la cause. Même remède que pour le service de rendu.
    extra_hosts:
      - "api.confinia.io:host-gateway"
    volumes:
      # Country-level GeoIP (dbip-country-lite) — provisioned by deploy.sh,
      # outside git and outside the rsync --delete scope.
      - ./data/geoip:/geoip:ro
      # Lead capture (offer page) — persisted outside git/rsync, shared by
      # both stacks so no lead is lost across promotes.
      - ./data/leads:/leads
      # Cache disque des tuiles bâtiments (/v1/tiles) : partagé blue/green pour
      # qu'un promote ne reparte pas d'un cache froid — le quota BDNB amont est
      # de 10 000 requêtes/mois pour toute la VM.
      - ./data/tiles:/tiles
    networks:
      default:
      internal: {}
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: ecobuilding-frontend:latest
    restart: unless-stopped

  # App-local OTel buffer; its prometheus exporter (:8889) is published per
  # stack (blue 127.0.0.1:13060 / green :13061 via the override files) and
  # scraped by the SHARED monitoring project (monitoring_stack/), which owns
  # prometheus + grafana + podman-exporter — metrics survive promotes.
  otel-collector:
    image: docker.io/otel/opentelemetry-collector-contrib:0.119.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./monitoring/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    # ports: set per stack by deploy/{blue,green}.override.yml
    restart: unless-stopped

networks:
  default: {}
  # Created by deploy/stack-up.sh (podman network create ecobuilding-internal).
  internal:
    name: ecobuilding-internal
    external: true
