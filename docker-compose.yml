# EcoBuilding — ONE complete, self-contained stack (app + its own edge caddy
# + full monitoring). Instantiated TWICE for blue/green:
#
#   podman-compose -p ecobuilding-blue  -f docker-compose.yml -f deploy/blue.override.yml  up -d
#   podman-compose -p ecobuilding-green -f docker-compose.yml -f deploy/green.override.yml up -d
#
# The ONLY published port is this stack's caddy (blue 127.0.0.1:8021, green
# 127.0.0.1:8022 — set by the override files); everything else stays on the
# stack's private network, so the two stacks can never collide. The router
# (caddy_server/) maps prod/next hostnames to the stacks; the VM's main caddy
# terminates TLS and forwards to the router.

services:
  # Stack entry: routes /api, /grafana and / to this stack's own services.
  caddy:
    image: docker.io/library/caddy:2
    volumes:
      - ./stack_caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    # ports: set per stack by deploy/{blue,green}.override.yml
    restart: unless-stopped

  api:
    build: ./api
    image: ecobuilding-api:latest
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: ecobuilding-api
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: ecobuilding-frontend:latest
    restart: unless-stopped

  otel-collector:
    image: docker.io/otel/opentelemetry-collector-contrib:0.119.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./monitoring/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    restart: unless-stopped

  prometheus:
    image: docker.io/prom/prometheus:v3.1.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=90d"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
    restart: unless-stopped

  grafana:
    image: docker.io/grafana/grafana-oss:11.5.1
    env_file:
      - ./deploy/secrets.env   # GF_SECURITY_ADMIN_PASSWORD (gitignored)
    environment:
      GF_SERVER_ROOT_URL: https://ecobuilding.confinia.io/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped

  # Per-container metrics of the (rootless) podman user. Requires the user
  # socket: systemctl --user enable --now podman.socket
  # Rootless: host uid 1000 (socket owner) maps to container root — the
  # exporter must run as root INSIDE the container to read the socket.
  podman-exporter:
    image: quay.io/navidys/prometheus-podman-exporter:latest
    user: "0"
    environment:
      CONTAINER_HOST: unix:///run/podman/podman.sock
    command: ["--collector.enable-all"]
    volumes:
      - ${XDG_RUNTIME_DIR:-/run/user/1000}/podman/podman.sock:/run/podman/podman.sock:ro
    security_opt:
      - label=disable
    restart: unless-stopped

volumes:
  prom_data:
  grafana_data:
