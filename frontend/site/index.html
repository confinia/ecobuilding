<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EcoBuilding — la carte d'identité écologique de chaque bâtiment</title>
  <meta name="description" content="DPE, interdiction de location, risques naturels, potentiel solaire : toutes les données ouvertes d'un bâtiment français, en 3D.">
  <link rel="stylesheet" href="assets/maplibre/maplibre-gl.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map"></div>

  <header id="topbar">
    <div id="brand">🏢 <strong>EcoBuilding</strong><span class="beta">beta</span></div>
    <div id="searchbox">
      <input id="search" type="text" placeholder="Adresse en France… (ex: 7 rue Pierre Corneille, Amiens)" autocomplete="off">
      <ul id="suggestions" hidden></ul>
    </div>
    <a id="apilink" href="/api/v1/docs" title="API publique">API</a>
    <a id="offerlink" href="/offres.html" title="Offres et accès entreprise">Offres</a>
    <span id="auth-area">
      <a id="signin" href="#" hidden>Se connecter</a>
      <a id="signup" href="#" hidden>Créer un compte</a>
      <a id="gopro" href="#" hidden title="Passer à l'offre Pro">Passer Pro</a>
      <span id="userchip" hidden><span id="userlabel"></span> <a id="signout" href="#" title="Se déconnecter">✕</a></span>
    </span>
  </header>

  <div id="legend" hidden>
    <strong>DPE</strong>
    <span class="lg dpe-A">A</span><span class="lg dpe-B">B</span><span class="lg dpe-C">C</span><span class="lg dpe-D">D</span><span class="lg dpe-E">E</span><span class="lg dpe-F">F</span><span class="lg dpe-G">G</span><span class="lg lg-none">?</span>
  </div>

  <aside id="panel" hidden>
    <button id="close" type="button" aria-label="Fermer">×</button>
    <div id="panel-content"></div>
    <footer class="attribution">
      Données : <a href="https://bdnb.io" target="_blank" rel="noopener">BDNB (CSTB)</a>,
      <a href="https://adresse.data.gouv.fr" target="_blank" rel="noopener">BAN</a>,
      <a href="https://www.georisques.gouv.fr" target="_blank" rel="noopener">Géorisques</a> — Licence Ouverte · <a href="/apropos.html">à propos</a>
    </footer>
  </aside>

  <script src="env.js"></script>
  <!-- Pure geometry helper (window.ecoGeo.featuresCenter), shared with the PDF
       render (render_stack/geo.js) so the building marker anchors identically. -->
  <script src="geo.js"></script>
  <!-- MapLibre 6.x is ESM-only and its tile-worker chunk must be served
       same-origin (a CDN like esm.sh silently breaks the worker → the map never
       loads). So we vendor the dist (assets/maplibre/) and import it here,
       expose the classic `maplibregl` global app.js expects, then boot app.js. -->
  <script type="module">
    import * as maplibregl from './assets/maplibre/maplibre-gl.mjs';
    window.maplibregl = maplibregl;
    const s = document.createElement('script');
    s.src = 'app.js';
    document.body.appendChild(s);
  </script>
</body>
</html>
