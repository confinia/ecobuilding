      <stop offset="0" stop-color="#245c3c"/>
      <stop offset="1" stop-color="#2b7a4b"/>
    </linearGradient>
  </defs>
  <rect width="1128" height="191" fill="url(#bg)"/>
  <!-- skyline strip, DPE greens -->
