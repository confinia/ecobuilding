<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="EcoBuilding">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#245c3c"/>
      <stop offset="1" stop-color="#2b7a4b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- DPE skyline -->
  <g opacity="0.95">
    <rect x="640"  y="430" width="70" height="200" rx="10" fill="#a5cc74"/>
    <rect x="726"  y="360" width="70" height="270" rx="10" fill="#52b153"/>
    <rect x="812"  y="290" width="70" height="340" rx="10" fill="#009036"/>
