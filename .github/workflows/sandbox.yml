# Rule 14: PR opened/updated -> the branch auto-deploys to the SANDBOX stack.
# Runs on the VM itself (self-hosted runner, ecobuilding user) — the checkout
# is synced into ~/projects/ecobuilding exactly like the break-glass rsync.
name: sandbox
on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: vm-deploy            # one VM, one deploy at a time (shared with staging)
  cancel-in-progress: false

jobs:
  sandbox:
    runs-on: [self-hosted, vm, ecobuilding]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # origin/main nécessaire au diff render_stack/ (#341)

      - name: Sync branch tree to ~/projects/ecobuilding
        run: |
          rsync -az --delete \
            --exclude .git --exclude __pycache__ --exclude .venv --exclude node_modules \
            --exclude deploy/secrets.env --exclude deploy/.active \
            --exclude caddy_server/Caddyfile --exclude data/ \
            --exclude sandbox_stack/secrets.env --exclude sandbox_stack/data/ \
            ./ ~/projects/ecobuilding/

      # ssh localhost: podman helpers (conmon, rootlessport, pasta) must not
      # live in the job's cgroup (runner post-job cleanup reaps them, #144)
      # nor in a transient unit (stop-timeout reaps them too) — a logind
      # login session with lingering is the context that provably survives.
      - name: Deploy the sandbox stack
        run: ssh -o BatchMode=yes localhost 'cd ~/projects/ecobuilding && ./deploy/sandbox.sh'

      # Contrôle de la pile de rendu (#341) : l'image se CONSTRUIT (JS
      # syntaxiquement valide, dépendances présentes). On ne la déploie pas
      # ici — elle est partagée avec la prod.
      - name: Render image builds
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD -- render_stack/ | grep -q .; then
            cd render_stack && podman build -q -t ecobuilding-render-check . >/dev/null && echo "image de rendu OK"
          else
            echo "render_stack/ inchangé"
          fi

      - name: Test suite (hermetic container)
        run: cd ~/projects/ecobuilding && ./deploy/test.sh

      # Rule 19: app-running tests belong to the pipeline. Drives real keyed
      # calls through the public sandbox host and asserts the credit counter.
      - name: Usage metering e2e (#201)
        run: ssh -o BatchMode=yes localhost 'cd ~/projects/ecobuilding && ./deploy/e2e-usage.sh'

      # Rule 19 + #212: the sign-up journey must stay autonomous on every PR.
      - name: Sign-up journey e2e (#212)
        run: ssh -o BatchMode=yes localhost 'cd ~/projects/ecobuilding && ./deploy/e2e-signup.sh'

      - name: Public smoke
        run: |
          sleep 2
          curl -fsS -m 20 https://sandbox.ecobuilding.confinia.io/api/v1/healthz
          python3 e2e/smoke.py https://sandbox.ecobuilding.confinia.io
          echo "sandbox: https://sandbox.ecobuilding.confinia.io"

      # Rule 20: the pipeline mails its own failures to a mailbox the session
      # can actually read (contact@ is a redirection; GitHub notifies the
      # owner's personal inbox only).
      - name: Notify failure by e-mail
        if: failure()
        run: ssh -o BatchMode=yes localhost 'cd ~/projects/ecobuilding && ./deploy/ci-notify.sh "sandbox" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" "${{ github.ref_name }}"'
