# Rule 14: manual promote — flip the router so the validated CANDIDATE stack
# becomes production (rule 3: only after validation on staging). Instant
# rollback stays available (deploy/rollback.sh).
name: promote
on:
  workflow_dispatch:

concurrency:
  group: vm-deploy
  cancel-in-progress: false

jobs:
  promote:
    runs-on: [self-hosted, vm, ecobuilding]
    steps:
      # ssh localhost: see #144 — podman helpers run in a logind session.
      - name: Flip router to the candidate stack
        run: ssh -o BatchMode=yes localhost 'cd ~/projects/ecobuilding && ./deploy/promote-up.sh'

      - name: Public smoke (production)
        run: |
          sleep 2
          curl -fsS -m 10 https://ecobuilding.confinia.io/api/v1/healthz
          # Même contrôle qu'en staging (lecture seule) : la production ne doit
          # pas être le seul environnement qu'on ne vérifie qu'au healthz.
          python3 e2e/smoke.py https://ecobuilding.confinia.io
          curl -fsS -m 10 -o /dev/null -w "prod frontend: %{http_code}\n" https://ecobuilding.confinia.io/
          echo "OK — https://ecobuilding.confinia.io"

      # Rule 20: the pipeline mails its own failures to a mailbox the session
      # can actually read (contact@ is a redirection; GitHub notifies the
      # owner's personal inbox only).
      - name: Notify failure by e-mail
        if: failure()
        run: ssh -o BatchMode=yes localhost 'cd ~/projects/ecobuilding && ./deploy/ci-notify.sh "promote" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" "${{ github.ref_name }}"'
