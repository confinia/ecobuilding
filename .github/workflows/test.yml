# Reusable test gate (#411): run the pytest suite on a GitHub-hosted runner,
# not the shared VM. The suite is hermetic — it exercises the app and asserts
# config-as-code files from the checkout, needing nothing from the VM — so the
# apt-get + pip + pytest churn (disk + CPU) no longer lands on the shared box.
# deploy/test.sh runs the suite in a stock python:3.12-slim via docker, which
# ubuntu-latest provides out of the box; the SAME script still works on the VM
# as a break-glass local gate.
name: test

on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test suite (hermetic container)
        run: ./deploy/test.sh
