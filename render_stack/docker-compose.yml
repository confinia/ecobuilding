# EcoBuilding RENDER (project: ecobuilding-render, issue #88). Stateless headless
# map renderer, shared like bdnb-rest / auth (outside blue/green). Loopback
# 127.0.0.1:13080; bridged consumers use the ecobuilding-internal alias render.
services:
  render:
    build: .
    image: ecobuilding-render:latest
    shm_size: 1g
    ports:
      - "127.0.0.1:13080:8040"   # 1PESI (#173); consumers use alias render
    networks:
      default:
      internal:
        aliases: [render]
    # Le rendu tire les tuiles de bâtiments par l'URL PUBLIQUE que l'API lui
    # passe. Or un conteneur sans privilèges ne peut pas joindre l'IP publique
    # de son propre hôte : la connexion est refusée (retour en épingle). On
    # renvoie donc ces noms vers l'hôte lui-même, où l'edge écoute — le
    # certificat correspond, le SNI aussi, rien d'autre ne change.
    #
    # Sans cela le rendu échoue en 500 et la fiche sort sans sa carte 3D.
    extra_hosts:
      - "ecobuilding.confinia.io:host-gateway"
      - "staging.ecobuilding.confinia.io:host-gateway"
      - "sandbox.ecobuilding.confinia.io:host-gateway"
    restart: unless-stopped

networks:
  default: {}
  internal:
    name: ecobuilding-internal
    external: true
