# EcoBuilding RENDER (project: ecobuilding-render, issue #88). Stateless headless
# map renderer, shared like bdnb-rest / auth (outside blue/green). Published on
# 0.0.0.0:8040 (ufw-blocked); the API reaches it via host.containers.internal.
services:
  render:
    build: .
    image: ecobuilding-render:latest
    shm_size: 1g
    ports:
      - "8040:8040"
    restart: unless-stopped
