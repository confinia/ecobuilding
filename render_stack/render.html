<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!-- MapLibre 6.x is ESM-only; its tile-worker chunk must be served same-origin
     (a CDN breaks the worker → no render). server.js serves this page + the
     vendored dist over http, so the import below resolves same-origin. geo.js
     stays a classic script so window.ecoGeo is set before the module runs. -->
<link href="/vendor/maplibre/maplibre-gl.css" rel="stylesheet">
<script src="geo.js"></script>
<style>html,body{margin:0;padding:0}#map{width:960px;height:540px}</style>
</head>
<body>
<div id="map"></div>
<script type="module">
import * as maplibregl from '/vendor/maplibre/maplibre-gl.mjs';
// Server-side twin of the web map (frontend/site/app.js): OpenFreeMap liberty +
// public BDNB vector tiles, extruded and colored by DPE class. Camera + target
// building come from the query string; puppeteer waits for window.__ready.
const q = new URLSearchParams(location.search);
const lon = +q.get('lon'), lat = +q.get('lat');
const zoom = +(q.get('zoom') || 18), pitch = +(q.get('pitch') || 60),
      bearing = +(q.get('bearing') || -25), bid = q.get('bdnb_id') || '';
// Points d'intérêt à ÉTIQUETER (#324) : ?points=[{lon,lat,label}] en JSON.
// Écoles aujourd'hui ; le paramètre est générique pour les commodités de
// demain (commerces, transports) — le rendu ne connaît que des lieux nommés.
let points = [];
try { points = JSON.parse(q.get('points') || '[]').slice(0, 40); } catch {}
const DPE = ["match", ["get", "classe_bilan_dpe"],
  "A", "#009036", "B", "#52b153", "C", "#a5cc74", "D", "#f4e70f",
  "E", "#f0b40f", "F", "#eb8235", "G", "#d7221f", "#d5cdc0"];
const map = new maplibregl.Map({
  container: 'map', style: 'https://tiles.openfreemap.org/styles/liberty',
  center: [lon, lat], zoom, pitch, bearing,
  interactive: false, attributionControl: false, fadeDuration: 0, preserveDrawingBuffer: true,
});
map.on('load', () => {
  for (const l of map.getStyle().layers) {
    if (/building/i.test(l.id)) map.removeLayer(l.id);   // only BDNB extrudes
  }
  // Tuiles servies par NOTRE cache (comme la carte web) : chaque fiche PDF
  // tirait ~15 tuiles sur api.bdnb.io depuis l'IP de la VM, plafonnée à 10 000
  // requêtes/mois — soit ~650 fiches/mois avant que la 3D disparaisse des PDF.
  // L'API passe ?tiles=<son URL publique> : en blue-green, le conteneur API
  // n'a pas de nom stable sur le réseau interne, on repasse donc par l'edge.
  map.addSource('bdnb', { type: 'vector',
    tiles: [q.get('tiles') || 'https://ecobuilding.confinia.io/api/v1/tiles/batiment_groupe/{z}/{x}/{y}.pbf'],
    minzoom: 14, maxzoom: 14 });   // BDNB ne publie que le z14
  // Limites de parcelles cadastrales — IGN, Licence Ouverte, sans clé.
  // « Où s'arrête le terrain ? » est une des premières questions d'un acheteur,
  // et un volume posé sur un fond de plan n'y répond pas.
  //
  // Tuiles VECTORIELLES : la version image imprime le numéro de chaque parcelle
  // par-dessus la carte, illisible à cette échelle. Ici on ne trace que les
  // limites, sous les volumes.
  map.addSource('pci', { type: 'vector',
    tiles: ['https://data.geopf.fr/tms/1.0.0/PCI/{z}/{x}/{y}.pbf'],
    minzoom: 13, maxzoom: 16 });
  map.addLayer({ id: 'pci-parcelles', source: 'pci', 'source-layer': 'parcelle',
    type: 'line', minzoom: 15,
    paint: { 'line-color': '#ff8a00', 'line-width': 1.4, 'line-opacity': 0.85 } });

  const height = ['coalesce', ['get', 'hauteur_mean'], 6];
  // All buildings dimmed; the target rendered full-opacity so it stands out.
  map.addLayer({ id: 'bdnb-all', source: 'bdnb', 'source-layer': 'sql_statement',
    type: 'fill-extrusion', minzoom: 13,
    paint: { 'fill-extrusion-color': DPE, 'fill-extrusion-height': height,
             'fill-extrusion-opacity': 0.55 } });
  if (bid) map.addLayer({ id: 'bdnb-target', source: 'bdnb', 'source-layer': 'sql_statement',
    type: 'fill-extrusion', minzoom: 13,
    filter: ['==', ['get', 'batiment_groupe_id'], bid],
    paint: { 'fill-extrusion-color': DPE, 'fill-extrusion-height': height,
             'fill-extrusion-opacity': 1 } });
  // Once tiles are in, recenter the camera on the target building's footprint
  // (the BAN address point leaves it off-centre) and drop a pin identifying it.
  // Fall back to the address point when the feature isn't in the loaded tiles.
  map.once('idle', () => {
    let center = null;
    if (bid) {
      const feats = map.querySourceFeatures('bdnb',
        { sourceLayer: 'sql_statement', filter: ['==', ['get', 'batiment_groupe_id'], bid] });
      center = ecoGeo.featuresCenter(feats);   // building footprint centre
    }
    // Pin identifying the target building (issue #113): its tip sits on the
    // footprint centroid, so the printed 3D map clearly points at the building.
    new maplibregl.Marker({ color: '#2b7a4b' }).setLngLat(center || [lon, lat]).addTo(map);
    // Les points d'intérêt : une pastille et son nom, en HTML — les couches
    // symbol exigeraient un glyphe et une police, un Marker non.
    for (const pt of points) {
      if (pt.lon == null || pt.lat == null) continue;
      const el = document.createElement('div');
      el.style.cssText = 'display:flex;align-items:center;gap:5px;font:600 13px sans-serif;';
      el.innerHTML = '<span style="width:13px;height:13px;border-radius:50%;' +
        'background:#1a5fb4;border:2.5px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.45)"></span>' +
        '<span style="background:rgba(255,255,255,.92);padding:2px 7px;border-radius:4px;' +
        'box-shadow:0 1px 2px rgba(0,0,0,.25);white-space:nowrap;max-width:230px;' +
        'overflow:hidden;text-overflow:ellipsis">' +
        String(pt.label || '').slice(0, 44).replace(/[<>&]/g, '') + '</span>';
      new maplibregl.Marker({ element: el, anchor: 'left' })
        .setLngLat([pt.lon, pt.lat]).addTo(map);
    }
    // Surcouche des zones inondables PPRI (#377) : UNE seule image GetMap
    // Géorisques couvrant la vue FINALE, posée sous les volumes. Une couche
    // raster tuilée ({bbox-epsg-3857}) ne se peignait pas de façon fiable dans
    // le rendu headless ; une image unique est déterministe, et on l'attend.
    const addFlood = (done) => {
      if (!q.get('ppri')) { done(); return; }
      const b = map.getBounds();
      const w = b.getWest(), s = b.getSouth(), e = b.getEast(), n = b.getNorth();
      const url = 'https://www.georisques.gouv.fr/services?SERVICE=WMS&VERSION=1.1.1'
        + '&REQUEST=GetMap&LAYERS=PPRN_ZONE_INOND&SRS=EPSG:4326'
        + '&BBOX=' + [w, s, e, n].join(',')
        + '&WIDTH=960&HEIGHT=540&FORMAT=image/png&TRANSPARENT=TRUE&STYLES=';
      map.addSource('ppri-img', { type: 'image', url,
        coordinates: [[w, n], [e, n], [e, s], [w, s]] });
      map.addLayer({ id: 'ppri-zones', source: 'ppri-img', type: 'raster',
        paint: { 'raster-opacity': 0.45 } }, 'bdnb-all');   // sous les volumes
      // En headless, la carte se déclarait « idle » AVANT que l'image WMS soit
      // téléchargée et peinte : la surcouche n'apparaissait pas. On attend donc
      // explicitement que la source image soit chargée, puis un idle pour la
      // peinture. Un filet de sécurité (4 s) garantit que __ready finit par
      // passer même si l'image n'arrive jamais — la fiche sort quand même.
      let settled = false;
      const finish = () => { if (settled) return; settled = true; done(); };
      const onData = (ev) => {
        if (ev.sourceId === 'ppri-img' && ev.isSourceLoaded) {
          map.off('sourcedata', onData);
          map.once('idle', finish);
        }
      };
      map.on('sourcedata', onData);
      setTimeout(finish, 4000);
    };
    if (center) {
      map.setCenter(center);   // building footprint -> container centre
      map.once('idle', () => addFlood(() => { window.__ready = true; }));
    } else {
      addFlood(() => { window.__ready = true; });
    }
  });
});
map.on('error', (e) => { window.__error = String((e && e.error) || e); });
</script>
</body>
</html>
