# EcoBuilding ops alerting as code (#128). Everything email-related lives in
# files: SMTP creds in deploy/secrets.env -> GF_SMTP_* (monitoring_stack
# compose); contact point, routing policy and alert rules here. Anything
# configured through the Grafana UI is lost on redeploy by design.
apiVersion: 1

contactPoints:
  - orgId: 1
    name: ops-email
    receivers:
      - uid: ops-email-rcv
        type: email
        settings:
          # contact@confinia.io redirects to the operator's current mailbox —
          # the redirect target changes in the OVH manager, never here.
          addresses: contact@confinia.io
          singleEmail: true

policies:
  - orgId: 1
    receiver: ops-email
    group_by: ["alertname"]
    group_wait: 1m
    group_interval: 5m
    repeat_interval: 4h

groups:
  - orgId: 1
    name: ops
    folder: Ops
    interval: 1m
    rules:
      # Any scrape target down for 5 min (api/otel collectors, prometheus
      # itself via `up`): the broadest cheap "something is wrong" signal.
      - uid: target-down
        title: Scrape target down (ecobuilding VM)
        condition: C
        for: 5m
        annotations:
          summary: >-
            At least one Prometheus scrape target is down on the ecobuilding VM
            (min(up) < 1). Check Grafana -> Explore -> `up` to see which.
        labels:
          severity: critical
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: min(up)
              instant: true
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: "__expr__"
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
