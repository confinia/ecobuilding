# EcoBuilding ops alerting as code (#128). Everything email-related lives in
# files: SMTP creds in deploy/secrets.env -> GF_SMTP_* (monitoring_stack
# compose); contact point, routing policy and alert rules here. Anything
# configured through the Grafana UI is lost on redeploy by design.
apiVersion: 1

contactPoints:
  - orgId: 1
    name: ops-email
    receivers:
      - uid: ops-email-rcv
        type: email
        settings:
          # contact@confinia.io redirects to the operator's current mailbox —
          # the redirect target changes in the OVH manager, never here.
          addresses: contact@confinia.io
          singleEmail: true

policies:
  - orgId: 1
    receiver: ops-email
    group_by: ["alertname"]
    group_wait: 1m
    group_interval: 5m
    repeat_interval: 4h

groups:
  - orgId: 1
    name: ops
    folder: Ops
    interval: 1m
    rules:
      # A target that CARRIES THE PRODUCT down for 5 min (api/otel collectors,
      # prometheus itself via `up`): the broadest cheap "something is wrong"
      # signal. The podman exporter is deliberately excluded — it only feeds
      # container charts, and its slowness used to page as a critical
      # incident on a Sunday evening (#343). It has its own warning below.
      - uid: target-down
        title: Scrape target down (ecobuilding VM)
        condition: C
        for: 5m
        annotations:
          summary: >-
            At least one product scrape target is down on the ecobuilding VM
            (min(up{job!="podman"}) < 1). Check Grafana -> Explore -> `up` to
            see which.
          # Alert emails render these as "Go to dashboard/panel" buttons with
          # the alert's time range — service detail + history in one click.
          __dashboardUid__: ecobuilding-main
          __panelId__: "6"  # "Scrape targets up" stat on the usage dashboard
        labels:
          severity: critical
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: min(up{job!="podman"})
              instant: true
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: "__expr__"
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }

      # The container-metrics exporter, separately and as a WARNING: losing it
      # costs charts, never service. Fifteen minutes of pending time so a slow
      # scrape or a restart stays silent; a real death still shows up (#343).
      - uid: podman-exporter-down
        title: Container metrics exporter down (ecobuilding VM)
        condition: C
        for: 15m
        annotations:
          summary: >-
            The podman exporter (:13081) has not answered for 15 minutes.
            Container CPU/memory charts are blind; the product is unaffected.
            Check `podman logs ecobuilding-monitoring_podman-exporter_1`.
          __dashboardUid__: ecobuilding-main
          __panelId__: "6"
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              expr: min(up{job="podman"})
              instant: true
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: "__expr__"
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }

      # La CI elle-même (#469, règle 25) : le dernier passage d'un workflow a
      # ÉCHOUÉ. Jusqu'ici un échec de pipeline ne se voyait que dans un mail —
      # que la session ne peut pas lire — ou dans GitHub, qu'il faut penser à
      # ouvrir. Avertissement et non critique : la production tourne toujours,
      # c'est la capacité à livrer qui est cassée.
      - uid: ci-workflow-failed
        title: CI workflow failed (ecobuilding)
        condition: C
        for: 10m
        annotations:
          summary: >-
            The last run of at least one workflow failed (meta.ci_last).
            Open the "CI — exécutions" dashboard for which one and its run
            URL, then `gh run view <id> --log-failed`.
          __dashboardUid__: ci-runs
          __panelId__: "2"
        labels:
          severity: warning
        data:
          # Une fenêtre NON NULLE, même si la requête n'en dépend pas (elle
          # lit meta.ci_last avec son propre now()) : Grafana refuse
          # `from: 0, to: 0` sur une requête de SOURCE — seul le nœud
          # `__expr__` a droit à zéro — et refuse le provisionnement ENTIER,
          # donc il redémarre en boucle et le monitoring tombe. Vécu le 27/09.
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: vues
            model:
              refId: A
              format: table
              rawQuery: true
              rawSql: >-
                SELECT now() AS time,
                       count(*)::float AS value
                FROM meta.ci_last
                WHERE conclusion = 'failure'
          # RÉDUIRE avant le seuil (#487) : la requête rend une colonne `time`,
          # donc une SÉRIE, et Grafana refuse d'alerter sur une série (« only
          # reduced data can be alerted on »). La règle n'a jamais évalué : elle
          # était en état Error — qui, lui, envoie des courriels.
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: "__expr__"
            model:
              type: reduce
              refId: B
              expression: A
              reducer: last
          # Seul `failure` compte : un déploiement annulé parce qu'un plus
          # récent le remplace n'est pas un échec.
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: "__expr__"
            model:
              type: threshold
              refId: C
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0] }
