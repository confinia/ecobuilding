apiVersion: 1
datasources:
  # The building-view log (#349), read directly from the BDNB Postgres.
  # Prometheus cannot hold coordinates — one series per building is exactly the
  # cardinality door #327 and #347 closed — so the map reads SQL instead.
  # Grafana runs on the host network; the database publishes 127.0.0.1:13030.
  - name: Vues
    uid: vues
    type: postgres
    access: proxy
    url: 127.0.0.1:13030
    user: bdnb
    database: bdnb
    isDefault: false
    secureJsonData:
      # From deploy/secrets.env, injected by the compose env_file.
      password: ${BDNB_DB_PASSWORD}
    jsonData:
      sslmode: disable
      postgresVersion: 1600
