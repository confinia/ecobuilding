apiVersion: 1
datasources:
  # The building-view log (#349), read directly from the BDNB Postgres.
  # Prometheus cannot hold coordinates — one series per building is exactly the
  # cardinality door #327 and #347 closed — so the map reads SQL instead.
  # Grafana runs on the host network; the database publishes 127.0.0.1:13030.
  - name: Vues
    uid: vues
    type: postgres
    access: proxy
    url: 127.0.0.1:13030
    # A READ-ONLY role, not the database owner: a dashboard needs to select
    # from one table and nothing else. Created on the VM with SELECT on
    # vues.vue_batiment only; its password lives in deploy/secrets.env as
    # GRAFANA_DB_PASSWORD (and BDNB_DB_PASSWORD, which the first version of
    # this file used, is not the bdnb role's password at all — hence the
    # « password authentication failed » the panel showed).
    user: grafana_ro
    database: bdnb
    isDefault: false
    secureJsonData:
      password: ${GRAFANA_DB_PASSWORD}
    jsonData:
      sslmode: disable
      postgresVersion: 1600
