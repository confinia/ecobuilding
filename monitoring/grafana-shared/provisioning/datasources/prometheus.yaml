apiVersion: 1
datasources:
  - name: Prometheus
    # Stable uid: the provisioned alert rules (alerting/ops-email.yaml)
    # reference the datasource by uid, never by name.
    uid: prometheus
    type: prometheus
    access: proxy
    # Shared monitoring runs on the HOST network: the shared prometheus
    # listens on loopback :9095 (see monitoring/prometheus-shared.yml).
    url: http://127.0.0.1:13050
    isDefault: true
