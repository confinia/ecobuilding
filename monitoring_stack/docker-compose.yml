# EcoBuilding SHARED MONITORING — third compose project (ecobuilding-monitoring),
# deliberately OUTSIDE the blue/green stacks so usage metrics survive promotes.
# Host network (loopback targets): scrapes both stacks' otel-collectors
# (blue 127.0.0.1:13060, green 127.0.0.1:13061) and the podman exporter.
# Grafana binds :13040 (1PESI band, #173);
# ufw does not expose it — public access goes through /grafana on the app hosts.
services:
  prometheus:
    image: docker.io/prom/prometheus:v3.1.0
    network_mode: host
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=180d"
      - "--web.listen-address=127.0.0.1:13050"
    volumes:
      - ../monitoring/prometheus-shared.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
    restart: unless-stopped

  grafana:
    image: docker.io/grafana/grafana-oss:11.5.1
    network_mode: host
    env_file:
      - ../deploy/secrets.env   # GF_SECURITY_ADMIN_PASSWORD (unchanged)
    environment:
      # Explicit IPv4 bind: with the default empty http_addr, a container
      # recreate can land Grafana on [::] ONLY (observed 2026-08-11 on :3002 →
      # /grafana 502: the app caddy proxies over IPv4). Pin it.
      GF_SERVER_HTTP_ADDR: "0.0.0.0"
      GF_SERVER_HTTP_PORT: "13040"
      # Nom propre plutôt que le chemin /grafana : les gestionnaires de mots
      # de passe classent par origine, et l'admin Grafana se mélangeait aux
      # identifiants de l'app. Le vhost est au bord plateforme (:13040).
      GF_SERVER_ROOT_URL: https://grafana.ecobuilding.confinia.io/
      GF_SERVER_SERVE_FROM_SUB_PATH: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      # Passwordless login via Keycloak (#372): the operator signs in with a
      # passkey (Face ID / Touch ID) on iam., never a Grafana password. The
      # local admin (GF_SECURITY_ADMIN_PASSWORD) stays as break-glass. All keys
      # optional-substituted: if GRAFANA_OAUTH_SECRET is unset (fresh clone),
      # the block is inert and Grafana keeps its password login.
      GF_AUTH_GENERIC_OAUTH_ENABLED: "${GRAFANA_OAUTH_SECRET:+true}"
      GF_AUTH_GENERIC_OAUTH_NAME: "Confinia (passkey)"
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: "grafana"
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: "${GRAFANA_OAUTH_SECRET:-}"
      GF_AUTH_GENERIC_OAUTH_SCOPES: "openid email profile roles"
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: "https://iam.ecobuilding.confinia.io/auth/realms/confinia/protocol/openid-connect/auth"
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: "https://iam.ecobuilding.confinia.io/auth/realms/confinia/protocol/openid-connect/token"
      GF_AUTH_GENERIC_OAUTH_API_URL: "https://iam.ecobuilding.confinia.io/auth/realms/confinia/protocol/openid-connect/userinfo"
      # Admin only for holders of the grafana-admin realm role; everyone else
      # who could authenticate gets nothing (no auto-Viewer for SaaS users who
      # share this realm). role_attribute_strict makes the absence a denial.
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(realm_access.roles[*], 'grafana-admin') && 'Admin' || 'None'"
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT: "true"
      GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN: "true"
      # No account auto-provisions itself into an org with a role it shouldn't.
      GF_AUTH_OAUTH_ALLOW_INSECURE_EMAIL_LOOKUP: "false"
      # Ops alert emails (#128) as code: SMTP_* come from deploy/secrets.env,
      # exported by deploy.sh (set -a) so compose substitutes them here. The
      # contact point/policy/rules are file-provisioned (provisioning/alerting).
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: "${SMTP_HOST:-ssl0.ovh.net}:${SMTP_PORT:-587}"
      GF_SMTP_USER: "${SMTP_USER:-}"
      GF_SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      GF_SMTP_FROM_ADDRESS: "${SMTP_FROM:-alert@confinia.io}"
      GF_SMTP_FROM_NAME: "Confinia Ops"
      GF_SMTP_STARTTLS_POLICY: "MandatoryStartTLS"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../monitoring/grafana-shared/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped

  podman-exporter:
    image: quay.io/navidys/prometheus-podman-exporter:latest
    network_mode: host
    user: "0"
    environment:
      CONTAINER_HOST: unix:///run/podman/podman.sock
    command: ["--collector.enable-all", "--web.listen-address=127.0.0.1:13081"]
    volumes:
      - ${XDG_RUNTIME_DIR}/podman/podman.sock:/run/podman/podman.sock:ro
    security_opt:
      - label=disable
    restart: unless-stopped

volumes:
  prom_data:
  grafana_data:
