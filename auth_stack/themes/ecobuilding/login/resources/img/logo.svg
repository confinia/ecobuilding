<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="EcoBuilding">
  <!-- EcoBuilding brand mark: a 3D-city skyline stepping through the DPE
       greens (A -> brand green), echoing the map's colored extrusions. -->
  <rect width="512" height="512" rx="96" fill="#f4f7f4"/>
  <g>
    <rect x="84"  y="268" width="100" height="160" rx="14" fill="#a5cc74"/>
    <rect x="206" y="196" width="100" height="232" rx="14" fill="#52b153"/>
    <rect x="328" y="116" width="100" height="312" rx="14" fill="#2b7a4b"/>
    <!-- windows -->
    <g fill="#f4f7f4" opacity="0.9">
      <rect x="108" y="292" width="20" height="20" rx="4"/>
      <rect x="140" y="292" width="20" height="20" rx="4"/>
      <rect x="108" y="328" width="20" height="20" rx="4"/>
      <rect x="140" y="328" width="20" height="20" rx="4"/>
      <rect x="230" y="220" width="20" height="20" rx="4"/>
      <rect x="262" y="220" width="20" height="20" rx="4"/>
      <rect x="230" y="256" width="20" height="20" rx="4"/>
      <rect x="262" y="256" width="20" height="20" rx="4"/>
      <rect x="352" y="140" width="20" height="20" rx="4"/>
      <rect x="384" y="140" width="20" height="20" rx="4"/>
      <rect x="352" y="176" width="20" height="20" rx="4"/>
      <rect x="384" y="176" width="20" height="20" rx="4"/>
    </g>
  </g>
</svg>
