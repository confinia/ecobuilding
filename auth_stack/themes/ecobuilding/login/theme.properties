# Thème de connexion EcoBuilding (#475).
#
# On ÉTEND le thème par défaut de Keycloak 26 (keycloak.v2, PatternFly 5) au
# lieu de le recopier : ses gabarits, ses messages et ses correctifs de
# sécurité continuent d'arriver avec chaque version de Keycloak, et nous ne
# possédons que ce qui est à nous — une feuille de style, un logo, deux
# messages.
parent=keycloak.v2
import=common/keycloak

# La feuille du parent D'ABORD, la nôtre ensuite : on surcharge ses variables,
# on ne la remplace pas. (Déclarer `styles` REMPLACE la liste du parent, d'où
# la reprise explicite de css/styles.css, résolu chez le parent.)
styles=css/styles.css css/ecobuilding.css

# Le site est clair ; une page de connexion qui passe au noir selon le réglage
# du système ressemble à un autre produit, au moment précis où l'on demande
# à quelqu'un de nous confier son adresse.
darkMode=false
