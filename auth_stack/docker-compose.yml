# EcoBuilding AUTH — shared identity stack (project: ecobuilding-auth).
# Like monitoring, deliberately OUTSIDE blue/green: user accounts are stateful
# and must survive promotes. Public exposure: /auth on the app hostnames,
# routed by the ecobuilding router (caddy_server) to 127.0.0.1:8180.
# Secrets (KC_BOOTSTRAP_ADMIN_PASSWORD, KC_DB_PASSWORD) live in
# ../deploy/secrets.env — generated by deploy.sh, never in git.
services:
  kc-db:
    image: docker.io/library/postgres:16
    # Passwords come ONLY from env_file (podman-compose does not interpolate
    # ${VARS} from service env_files): secrets.env carries POSTGRES_PASSWORD
    # (= KC_DB_PASSWORD), both written by deploy.sh.
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
    env_file:
      - ../deploy/secrets.env
    volumes:
      - kc_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    command: ["start", "--import-realm", "--cache=local"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://kc-db/keycloak
      KC_DB_USERNAME: keycloak
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: https://ecobuilding.confinia.io/auth
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
    env_file:
      - ../deploy/secrets.env
    volumes:
      - ./realm-confinia.json:/opt/keycloak/data/import/realm-confinia.json:ro
    ports:
      - "127.0.0.1:8181:8080"
    depends_on:
      - kc-db
    restart: unless-stopped

volumes:
  kc_pgdata:
